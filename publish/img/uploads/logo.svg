<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48" role="img" aria-label="Madonna">
  <!--
    Wordmark de comp: nome composto em tipo grotesco pesado, vermelho sobre
    o painel magenta — o par cromático da referência. Não é o logotipo
    oficial; substituir pelo asset do mídia kit.
  -->
  <rect width="240" height="48" fill="#ff3bf1"/>
  <text x="12" y="36" fill="#ff0000"
        font-family="'Archivo Black', Archivo, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="900" letter-spacing="-0.5">MADONNA</text>
</svg>
